<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Anderdingus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#0B72B5;--c-clat:#0B72B5;--c-ailet:#C8641C;--c-boards:#5B56B8;--soft:#E1F1FB;
  --bg:#F5FAFD;--surface:#FFFFFF;--surface-2:#EAF1F6;--line:#DCE7EE;--ink:#14232D;--muted:#667884;--on-accent:#FFFFFF;
  --shadow:0 1px 2px rgba(10,40,60,.04),0 8px 24px rgba(10,40,60,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--accent:#7CC4F2;--c-clat:#7CC4F2;--c-ailet:#F2A36B;--c-boards:#B0ADF0;--soft:#17303F;
    --bg:#0E1418;--surface:#162027;--surface-2:#1F2B34;--line:#293742;--ink:#EAF2F7;--muted:#96A8B4;--on-accent:#0A1A24;--shadow:none;color-scheme:dark}
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.serif{font-family:Fraunces,Georgia,serif}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:24px 14px 18px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 22px}
.brand-mark{width:34px;height:34px;border-radius:11px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:Fraunces,serif;font-weight:700;font-size:19px}
.brand b{font-family:Fraunces,serif;font-size:23px;font-weight:600;letter-spacing:-.01em}
.brand small{display:block;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.nav-btn{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--muted);background:none;border:0;font-weight:650;width:100%;text-align:left;font-size:14.5px}
.nav-btn:hover{background:var(--surface-2);color:var(--ink)}
.nav-btn.on{background:var(--soft);color:var(--accent)}
.nav-btn svg{flex:none}
.nav-sep{height:1px;background:var(--line);margin:10px 10px}
.side-foot{margin-top:auto;padding:14px 10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.mini-cd{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.mini-cd b{color:var(--ink);font-variant-numeric:tabular-nums}
main{padding:30px 34px 70px;width:100%;max-width:1140px}
.tabbar{display:none}

/* ---------- Generic ---------- */
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.eyebrow{font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:800}
h1{font-family:Fraunces,serif;font-weight:600;font-size:36px;letter-spacing:-.02em;line-height:1.1;margin-top:4px}
h2{font-size:16px;font-weight:750}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.card-hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.card-hd h2{display:flex;align-items:center;gap:8px}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:11.5px}
.grid{display:grid;gap:16px}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.sp{flex:1}
.mt{margin-top:16px}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:12px;font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:#C2413B}
.icon-btn{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.icon-btn:hover{background:var(--surface-2)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:700}
.chip:hover:not(:disabled){border-color:var(--accent)}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.chip:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;background:var(--surface-2);border-radius:13px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:10px;font-weight:750;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.09)}
.tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:color-mix(in srgb,var(--c,var(--accent)) 14%,transparent);color:var(--c,var(--accent));white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink)}
.bar{height:7px;background:var(--surface-2);border-radius:4px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.empty{padding:26px 10px;text-align:center;color:var(--muted);font-size:14px}
hr.sep{border:0;border-top:1px solid var(--line);margin:14px 0}

/* ---------- Today ---------- */
.cd-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
.cd{position:relative;overflow:hidden;border-radius:18px;padding:14px 16px 14px 20px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.cd::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.cd .num{font-family:Fraunces,serif;font-size:40px;font-weight:600;line-height:1;color:var(--c);font-variant-numeric:tabular-nums}
.cd .num small{font-size:14px;font-family:"Plus Jakarta Sans",sans-serif;font-weight:700;color:var(--muted);margin-left:4px}
.cd .what{font-weight:800;font-size:13.5px;margin-top:8px}
.cd .when{font-size:12px;color:var(--muted)}
.g-today{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);align-items:start}
.plan-ctl{display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:16px;background:var(--surface-2);margin-bottom:6px}
.plan-ctl .lbl{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}
.plan-ctl .chip{background:var(--surface)}
.plan-ctl .chip.on{background:var(--accent)}
.lock-note{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.blk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:13px;align-items:center;padding:13px 2px;border-top:1px solid var(--line)}
.blk:first-child{border-top:0}
.check{width:27px;height:27px;border-radius:9px;border:2px solid color-mix(in srgb,var(--c) 45%,var(--line));display:grid;place-items:center;background:none;color:transparent;transition:.15s}
.check:hover{border-color:var(--c)}
.blk.done .check{background:var(--c);border-color:var(--c);color:var(--on-accent)}
.blk .bt{font-weight:700;font-size:14.5px}
.blk .bs{font-size:12.5px;color:var(--muted);margin-top:2px}
.blk.done .bt{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.blk .min{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;font-weight:700;text-align:right}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-radius:14px;font-size:11.5px;font-weight:700;color:var(--muted)}
.wd.today{background:var(--soft);color:var(--accent)}
.wd.future{opacity:.55}
.upnext{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.upnext:first-of-type{border-top:0;padding-top:0}
.datebox{width:46px;flex:none;text-align:center;border-radius:12px;background:color-mix(in srgb,var(--c) 12%,transparent);color:var(--c);padding:6px 0}
.datebox b{display:block;font-family:Fraunces,serif;font-size:20px;line-height:1}
.datebox span{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.cov{display:grid;grid-template-columns:70px 1fr 40px;gap:10px;align-items:center;font-size:13px;font-weight:700;margin-top:10px}
.cov .bar i{background:var(--c)}

/* ---------- Calendar ---------- */
.ribbon-card{padding:16px 22px 10px}
.ribbon{position:relative;height:78px;margin:0 6px}
.track{position:absolute;left:0;right:0;top:38px;height:4px;border-radius:2px;background:var(--surface-2)}
.mk{position:absolute;top:0;height:78px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
.mk .dotm{position:absolute;top:33px;width:14px;height:14px;border-radius:50%;background:var(--c);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--c)}
.mk.mock .dotm{width:9px;height:9px;top:35.5px;border-width:2px;opacity:.8}
.mk .ml{position:absolute;white-space:nowrap;font-size:12px;font-weight:800;color:var(--c)}
.mk .ml span{color:var(--muted);font-weight:600}
.mk.up .ml{top:6px}.mk.down .ml{top:54px}
.mk.end{transform:translateX(-100%)}.mk.end .dotm{right:-7px}.mk.end .ml{right:0}
.mk.start{transform:none}.mk.start .dotm{left:-7px}.mk.start .ml{left:0}
.cal-wrap{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
.cal-top{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.cal-top .mon{font-family:Fraunces,serif;font-size:26px;font-weight:600;letter-spacing:-.01em;margin-right:auto}
.dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));margin-bottom:6px}
.dow span{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding-left:8px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.cell{background:var(--surface);min-height:100px;padding:6px 6px 12px;display:flex;flex-direction:column;gap:3px;position:relative;border:0;text-align:left;min-width:0}
.cell:hover{background:color-mix(in srgb,var(--accent) 4%,var(--surface))}
.cell.out{background:var(--surface-2);color:var(--muted)}
.cell.out .ev{opacity:.6}
.cell.wkend .dn{color:var(--muted)}
.cell .dn{font-size:13px;font-weight:750;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;flex:none}
.cell.today .dn{background:var(--accent);color:var(--on-accent)}
.cell.sel{box-shadow:inset 0 0 0 2px var(--accent);z-index:1}
.cell.exam{background:color-mix(in srgb,var(--c) 11%,var(--surface))}
.ev{font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ev.solid{background:var(--c);color:var(--on-accent)}
.more-ev{font-size:10.5px;color:var(--muted);font-weight:700;padding-left:4px}
.dots{display:none;gap:3px;justify-content:center}
.dot{width:6px;height:6px;border-radius:50%;background:var(--c)}
.prog{position:absolute;left:7px;right:7px;bottom:5px;height:3px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted);font-weight:650}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:3px;background:var(--c)}
.day-panel{position:sticky;top:20px}
.day-title{font-family:Fraunces,serif;font-size:24px;font-weight:600;line-height:1.1}
.ev-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.ev-row:first-child{border-top:0}
.ev-row .bul{width:10px;height:10px;border-radius:4px;background:var(--c);flex:none}
.agenda-m{font-family:Fraunces,serif;font-size:20px;font-weight:600;margin:18px 0 8px}
.agenda-m:first-child{margin-top:0}
.ag{display:grid;grid-template-columns:62px minmax(0,1fr);gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.ag .d{text-align:center}
.ag .d b{display:block;font-family:Fraunces,serif;font-size:24px;line-height:1}
.ag .d span{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase}
.ag .evs{display:flex;flex-direction:column;gap:6px}

/* ---------- Topics ---------- */
.pattern{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center}
.secq{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.secq span{font-size:12px;font-weight:700;padding:5px 9px;border-radius:9px;background:var(--surface-2)}
.secq b{color:var(--c)}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0}
.search{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:0 12px}
.search input[type=text]{border:0;background:none;outline:none;padding:10px 0;width:100%;border-radius:0}
.sec{padding:0;overflow:hidden}
.sec-hd{display:grid;grid-template-columns:minmax(0,1fr) 160px auto;gap:16px;align-items:center;padding:15px 18px;background:none;border:0;width:100%;text-align:left}
.sec-hd:hover{background:var(--surface-2)}
.sec-hd .nm{font-weight:800;font-size:15px}
.sec-hd .sub{font-size:12.5px;color:var(--muted);font-weight:600}
.sec-hd .chev{transition:transform .2s;color:var(--muted)}
.sec.open .chev{transform:rotate(90deg)}
.sec-body{display:none;padding:0 18px 8px}
.sec.open .sec-body{display:block}
.grp{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:14px 0 4px}
.trow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.trow .tn{font-weight:600;font-size:14px;min-width:0}
.also{font-size:10.5px;font-weight:800;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;white-space:nowrap}
.st{margin-left:auto;flex:none;font-size:12px;font-weight:800;border-radius:999px;padding:6px 11px;border:1.5px solid var(--line);background:var(--surface);min-width:104px;text-align:center;color:var(--muted)}
.st.s1{border-style:dashed;border-color:var(--c);color:var(--c)}
.st.s2{background:color-mix(in srgb,var(--c) 18%,transparent);border-color:transparent;color:var(--c)}
.st.s3{background:var(--c);border-color:var(--c);color:var(--on-accent)}

/* ---------- Mocks ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi .v{font-family:Fraunces,serif;font-size:32px;font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--muted);font-weight:700}
.delta{font-size:12.5px;font-weight:800}
.up{color:#2F8A5B}.down{color:#C2413B}
.g-mocks{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);align-items:start}
.chart svg{width:100%;height:auto;display:block}
.sbar{display:grid;grid-template-columns:120px minmax(0,1fr) 46px;gap:10px;align-items:center;font-size:13px;font-weight:700;padding:7px 0}
.sbar .bar{height:10px}
.sbar .bar i{background:var(--c)}
.mrow{display:grid;grid-template-columns:52px minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:13px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow .sc{font-family:Fraunces,serif;font-size:22px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.mrow .sc small{font-family:"Plus Jakarta Sans";font-size:12px;color:var(--muted);font-weight:700}
.minibars{display:flex;gap:3px;align-items:flex-end;height:24px;margin-top:6px}
.minibars i{width:10px;border-radius:2px 2px 0 0;background:var(--c);opacity:.85}
.sample-banner{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:var(--soft);color:var(--accent);font-size:13px;font-weight:700;margin-bottom:16px}

/* ---------- Projects ---------- */
.g-proj{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.proj .ptitle{font-weight:800;font-size:15.5px;line-height:1.3;margin:8px 0 4px}
.proj .due{font-size:12.5px;font-weight:700;color:var(--muted)}
.proj .due.soon{color:#C2413B}
.step{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:13.5px}
.step .check{width:21px;height:21px;border-radius:7px}
.step.done span{text-decoration:line-through;color:var(--muted)}
.proj.isdone{opacity:.7}

/* ---------- Settings / Account ---------- */
.g-set{grid-template-columns:repeat(auto-fit,minmax(380px,1fr));align-items:start}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;border-top:1px solid var(--line)}
.set-row:first-of-type{border-top:0}
.set-row .t{font-weight:700;font-size:14px}
.set-row .d{font-size:12.5px;color:var(--muted)}
.set-row .ctl{display:flex;align-items:center;gap:8px;flex:none}
.sw{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);position:relative;cursor:pointer;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw:checked{background:var(--accent);border-color:var(--accent)}
.sw:checked::after{transform:translateX(18px)}
input[type=time],input[type=date],input[type=text],input[type=email],input[type=password],input[type=number],select,textarea{padding:9px 11px;border-radius:11px;border:1px solid var(--line);background:var(--bg);outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}
.rng{display:grid;grid-template-columns:78px minmax(0,1fr) 46px;gap:12px;align-items:center;padding:8px 0;font-size:13.5px;font-weight:700}
.rng output{text-align:right;font-variant-numeric:tabular-nums}
.mixbar{height:12px;border-radius:6px;overflow:hidden;display:flex;margin:6px 0 4px}
.mixbar i{display:block;height:100%}
.mockrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.mockrow:first-child{border-top:0}
.addmock{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-top:12px}
.addmock .btn{grid-column:1/-1;justify-content:center}
.avatar{width:72px;height:72px;border-radius:24px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:Fraunces,serif;font-size:34px;font-weight:600;flex:none}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.02em}
.f2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.f2>*{min-width:0}
.field input:not(.sw),.field select,.field textarea{width:100%}
.subj{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-weight:650;font-size:14px}
.subj:first-child{border-top:0}
.subj input{width:18px;height:18px;accent-color:var(--accent)}

/* ---------- Sheet / toast / palette ---------- */
.backdrop{position:fixed;inset:0;background:rgba(12,9,11,.45);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
.backdrop.open{display:flex}
.sheet{background:var(--surface);border-radius:24px;width:min(540px,100%);max-height:88vh;overflow:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.sheet h3{font-family:Fraunces,serif;font-size:24px;font-weight:600;margin-bottom:14px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.pal-fab{position:fixed;right:20px;bottom:20px;z-index:40;display:flex;align-items:center;gap:8px;border:1px dashed var(--muted);background:var(--surface);border-radius:999px;padding:8px 14px 8px 10px;font-size:12.5px;font-weight:800;box-shadow:var(--shadow)}
.pal-pop{position:fixed;right:20px;bottom:66px;z-index:41;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;width:250px;box-shadow:0 12px 40px rgba(0,0,0,.18);display:none}
.pal-pop.open{display:block}
.pal-opt{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px;border-radius:10px;font-weight:700;font-size:13.5px;text-align:left}
.pal-opt:hover,.pal-opt.on{background:var(--surface-2)}
.sw3{display:flex}
.sw3 i{width:16px;height:16px;border-radius:50%;border:2px solid var(--surface);margin-left:-5px}
.sw3 i:first-child{margin-left:0}

/* ---------- Phone ---------- */
@media (max-width:860px){
  .g-set{grid-template-columns:1fr}
  .cal-top .mon{flex-basis:100%;font-size:24px}
  .app{grid-template-columns:1fr}
  .side{display:none}
  main{padding:calc(14px + env(safe-area-inset-top)) 16px calc(100px + env(safe-area-inset-bottom))}
  h1{font-size:30px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tab{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:750;color:var(--muted);padding:5px 0}
  .tab.on{color:var(--accent)}
  .g-today,.g-mocks,.cal-wrap,.pattern{grid-template-columns:1fr}
  .cd-row{gap:8px}
  .cd{padding:12px 10px 12px 15px}
  .cd .num{font-size:30px}
  .cd .num small{font-size:11px}
  .cd .what{font-size:12.5px}
  .kpis{grid-template-columns:1fr 1fr}
  .cell{min-height:58px;align-items:center;padding:5px 2px 10px}
  .cell .ev,.cell .more-ev{display:none}
  .cell .dots{display:flex}
  .dow span{padding-left:0;text-align:center}
  .day-panel{position:static}
  .sec-hd{grid-template-columns:minmax(0,1fr) auto;gap:10px}
  .sec-hd .bar{display:none}
  .sbar{grid-template-columns:96px minmax(0,1fr) 40px}
  .mrow{grid-template-columns:44px minmax(0,1fr) auto}
  .mrow .del{display:none}
  .pal-fab{bottom:calc(84px + env(safe-area-inset-bottom));right:12px}
  .pal-pop{bottom:calc(130px + env(safe-area-inset-bottom));right:12px}
  .backdrop{align-items:flex-end;padding:0}
  .sheet{border-radius:24px 24px 0 0;padding-bottom:calc(22px + env(safe-area-inset-bottom))}
  .toast{bottom:calc(92px + env(safe-area-inset-bottom))}
  .ribbon-card{padding:14px 16px 8px}
}

    const p=o.find(x=>!(out.length>=2&&out[out.length-1]===x&&out[out.length-2]===x))||o[0];cr[p]-=tot;out.push(p);}

function priority(id,k){const s=st(id),l=S.touched[id],g=l?diff(l,k):99;
  if(s===1&&g>=1)return 0; if(s===0)return 1; if(s===2&&g>=3)return 2; if(s===1)return 3; if(s===2)return 4; return 9;}
function pickTopic(stream,k,used,nth){

  if(stream==="boards"){
    const subs=S.profile.subjects.filter(s=>SUBJ[s]);if(!subs.length)return null;
    for(let j=0;j<subs.length;j++){const sk=subs[(off+j)%subs.length];
      const c=SUBJ[sk].ch.map((x,i)=>({...x,i})).filter(x=>!used.has(x.id)&&st(x.id)<3).sort(by);
      if(c.length)return{id:c[0].id,n:c[0].n,label:SUBJ[sk].n};}
    return null;
  }
  const order=stream==="clat"?["legal","eng","ca","lr","qt"]:["lr","eng","ca"];
  const passes=stream==="ailet"?[t=>!t.s.clat,()=>true]:[()=>true];
  for(const pass of passes)for(let j=0;j<order.length;j++){const sec=order[(off+j)%order.length];
    const c=ENT.filter(t=>t.s[stream]===sec&&pass(t)&&!used.has(t.id)&&st(t.id)<3).sort(by);
    if(c.length)return{id:c[0].id,n:c[0].n,label:`${EX[stream].short} · ${SECNAME[sec]}`};}

const TASK={e:{Learn:"concept + 15 untimed questions",Practice:"25 timed questions, then review misses",Revise:"notes + 20 mixed questions"},
            b:{Learn:"read the chapter, make notes",Practice:"answer 5 past-paper questions",Revise:"write one answer to time"}};
function buildPlan(k,hours,mock){
  if(!hours)return[];
  const L=S.settings.load,B=[];let left=hours*60,i=0;const id=()=>`${k}-${i++}`;
  const ex=examOn(k);
  if(ex)return[{id:id(),type:"Exam",title:EX[ex].name,sub:"Reach the centre 90 min early · admit card, photo ID, pens",min:120,s:ex},
               {id:id(),type:"Rest",title:"Walk, dinner, early night",sub:"No new topics today",min:30,s:"misc"}];
  const eve=["clat","ailet"].find(e=>S.profile.exams[e]&&diff(k,EX[e].date)===1);
  if(eve)return[{id:id(),type:"Recall",title:"Error log + maxims sheet",sub:`Light only: ${EX[eve].short} is tomorrow`,min:60,s:eve},
                {id:id(),type:"News",title:"Skim last 3 months of current-affairs notes",sub:"Headlines only",min:45,s:eve},
                {id:id(),type:"Prep",title:"Admit card, ID, route, bag packed",sub:"Sleep by 10:30",min:15,s:eve}];
  if(mock){const m=mockOn(k),s=m?m.exam:"clat";
    B.push({id:id(),type:"Mock",title:m?`${m.provider} ${EX[s].short} mock`:"Full-length mock",sub:`${m&&m.time?m.time+" · ":""}one sitting, exam conditions`,min:120,s});
    B.push({id:id(),type:"Analysis",title:"Mock analysis",sub:"Tag every miss: concept, careless, time or guess",min:S.settings.analysis,s});
    left-=120+S.settings.analysis;}
  if(!mock||left>=45){B.push({id:id(),type:"News",title:"Current affairs",sub:"Newspaper + add 10 facts to your notes",min:30,s:"misc"});
    B.push({id:id(),type:"Recall",title:"Error-log recall",sub:"Retry yesterday's wrong answers",min:15,s:"misc"});left-=45;}
  let n=Math.min(L.max,Math.floor(Math.max(0,left)/L.block));if(!mock)n=Math.max(1,n);
  const slots=pickSlots(n,mixFor(k)),used=new Set(),nth={clat:0,ailet:0,boards:0};
  const proj=S.projects.filter(p=>!p.done&&p.due&&diff(k,p.due)>=0&&diff(k,p.due)<=7).sort((a,b)=>a.due.localeCompare(b.due))[0];
  let pu=false;
  slots.forEach(s=>{
    if(s==="boards"&&proj&&!pu){pu=true;const nx=proj.steps.find(x=>!x.d);
      B.push({id:id(),type:"Project",title:proj.title,sub:`Due ${fmt(proj.due,{weekday:"short",day:"numeric",month:"short"})}${nx?" · next: "+nx.t:""}`,min:L.block,s:"boards",pid:proj.id});return;}
    const t=pickTopic(s,k,used,nth[s]++);if(!t)return;used.add(t.id);
    const typ=["Learn","Practice","Revise"][Math.min(2,st(t.id))];
    B.push({id:id(),type:typ,title:t.n,sub:`${t.label} · ${TASK[s==="boards"?"b":"e"][typ]}`,min:L.block,s,tid:t.id});
  });
  return B;
}
function ensureDay(k){

// ---------- Mock scores ----------
function scoreCalc(s){if(s.exam==="pre")return{t:s.total,m:s.max};const T=SCORE_T[s.exam];return{t:T.reduce((a,[id])=>a+(+s.sec[id]||0),0),m:T.reduce((a,[,mx])=>a+mx,0)};}
const pctOf=s=>{const{t,m}=scoreCalc(s);return m?t/m*100:0;};
function chart(list){
  if(!list.length)return'<div class="empty">Log a mock to see the trend.</div>';
  const W=640,H=230,pl=36,pr=14,pt=14,pb=30,ts=list.map(s=>parse(s.date).getTime()),lo0=Math.min(...ts),hi0=Math.max(...ts),sp=hi0-lo0;
  const ps=list.map(pctOf),lo=Math.max(0,Math.floor((Math.min(...ps)-8)/10)*10),hi=Math.min(100,Math.ceil((Math.max(...ps)+8)/10)*10);
  const x=t=>sp?pl+(t-lo0)/sp*(W-pl-pr):(pl+W-pr)/2,y=p=>pt+(1-(p-lo)/((hi-lo)||1))*(H-pt-pb);
  let g="";for(let v=lo;v<=hi;v+=10)g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="${v===lo?"0":"3 4"}"/><text x="${pl-8}" y="${y(v)}" text-anchor="end" dominant-baseline="middle" font-size="11" fill="var(--muted)">${v}%</text>`;
  const ex=[...new Set(list.map(s=>s.exam))];
  const series=ex.map(e=>{const pts=list.filter(s=>s.exam===e).sort((a,b)=>a.date.localeCompare(b.date)).map(s=>[x(parse(s.date).getTime()),y(pctOf(s)),s]);
    return`<path d="${pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ")}" fill="none" stroke="${col(e)}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`+
      pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="var(--surface)" stroke="${col(e)}" stroke-width="2.5"><title>${esc(p[2].provider)} ${esc(p[2].name)} · ${pctOf(p[2]).toFixed(1)}%</title></circle><text x="${p[0]}" y="${p[1]-11}" text-anchor="middle" font-size="11" font-weight="800" fill="${col(e)}">${Math.round(pctOf(p[2]))}</text>`).join("");}).join("");
  const dates=[...new Set(list.map(s=>s.date))].sort();
  const xl=dates.map(d=>`<text x="${x(parse(d).getTime())}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${fmt(d)}</text>`).join("");
  return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Mock score trend">${g}${series}${xl}</svg>`;
}
function vMocks(){
  const ui=S.ui,ent=S.scores.filter(s=>s.exam!=="pre"),sorted=[...S.scores].sort((a,b)=>b.date.localeCompare(a.date));

  const avg3=e=>{const l=of(e).slice(-3);return l.length?l.reduce((a,s)=>a+pctOf(s),0)/l.length:null;};
  const dlt=e=>{const l=of(e);if(l.length<2)return"";const d=pctOf(l[l.length-1])-pctOf(l[l.length-2]);return`<span class="delta ${d>=0?"up":"down"}">${d>=0?"▲":"▼"} ${Math.abs(d).toFixed(1)} pts</span>`;};
  const last=e=>{const l=of(e);if(!l.length)return"–";const{t,m}=scoreCalc(l[l.length-1]);return`${+t.toFixed(2)}<span class="small muted">/${m}</span>`;};
  const kpis=`<div class="kpis">
    <div class="card kpi"><div class="l">Mocks logged</div><div class="v">${ent.length}</div><div class="small muted">${of("clat").length} CLAT · ${of("ailet").length} AILET</div></div>

    <div class="card kpi" style="--c:var(--c-ailet)"><div class="l">Latest AILET</div><div class="v" style="color:var(--c)">${last("ailet")}</div>${dlt("ailet")}</div>
    <div class="card kpi"><div class="l">Avg of last 3</div><div class="v" style="font-size:24px;margin-top:6px"><span style="color:var(--c-clat)">${avg3("clat")!=null?avg3("clat").toFixed(1)+"%":"–"}</span> <span class="muted" style="font-size:16px">/</span> <span style="color:var(--c-ailet)">${avg3("ailet")!=null?avg3("ailet").toFixed(1)+"%":"–"}</span></div><div class="small muted">CLAT / AILET</div></div></div>`;
  const cl=ui.mf==="all"?ent:ent.filter(s=>s.exam===ui.mf);

  const list=sorted.map(s=>{const{t,m}=scoreCalc(s),e=s.exam;
    const bars=e==="pre"?"":`<div class="minibars">${SCORE_T[e].map(([id,mx])=>`<i style="height:${Math.max(8,(+s.sec[id]||0)/mx*100)}%" title="${SECNAME[id]}: ${s.sec[id]??0}/${mx}"></i>`).join("")}</div>`;
    return`<div class="mrow" style="--c:${col(e)}"><div class="datebox" style="--c:${col(e)}"><b>${parse(s.date).getDate()}</b><span>${fmt(s.date,{month:"short"})}</span></div>
      <div style="min-width:0"><div class="row" style="gap:8px"><span class="tag">${e==="pre"?"Pre-board":EX[e].short}</span><b style="font-size:14px">${esc(s.provider)} ${esc(s.name)}</b>${s.sample?'<span class="also">sample</span>':""}</div>
        <div class="small muted">${e==="pre"?esc(SUBJ[s.subj]?.n||""):SCORE_T[e].map(([id])=>`${id.toUpperCase()} ${s.sec[id]??"–"}`).join(" · ")}${s.pctile?` · ${s.pctile} percentile`:""}</div>${bars}</div>
      <div class="sc">${+t.toFixed(2)}<small>/${m}</small></div>
      <button class="icon-btn del" data-act="score-del" data-id="${s.id}" aria-label="Delete">${icon("trash",15)}</button></div>`;}).join("")||'<div class="empty">No scores yet.</div>';
  return`<div class="hd"><div><div class="eyebrow" style="display:none">Mock scores</div><h1>Mock Scores</h1></div><button class="btn pri" data-act="score-new">${icon("plus",16)} Add score</button></div>
    ${kpis}
    <div class="grid g-mocks">
      <div class="card chart"><div class="card-hd"><h2>Score trend (% of max)</h2><div class="seg"><button class="${ui.mf==="all"?"on":""}" data-act="mf" data-f="all">Both</button><button class="${ui.mf==="clat"?"on":""}" data-act="mf" data-f="clat">CLAT</button><button class="${ui.mf==="ailet"?"on":""}" data-act="mf" data-f="ailet">AILET</button></div></div>${chart(cl)}</div>
      <div class="card"><div class="card-hd"><h2>Section strength</h2><div class="seg"><button class="${sx==="clat"?"on":""}" data-act="sx" data-e="clat">CLAT</button><button class="${sx==="ailet"?"on":""}" data-act="sx" data-e="ailet">AILET</button></div></div>${sbars}</div>
    </div>
    <div class="card mt"><div class="card-hd"><h2>All scores</h2></div>${list}</div>`;
}

async function push(force){
  if(!sb||!AUTH.user||(!syncReady&&!force))return;
  try{S._ts=S._ts||Date.now();
    const{error}=await sb.from("app_state").upsert({user_id:AUTH.user.id,data:{...dataOf(),_ts:S._ts},updated_at:new Date().toISOString()});

function applyRemote(r){

async function pull(){

    setSync("Syncing…");
    const{data,error}=await sb.from("app_state").select("data").eq("user_id",AUTH.user.id).maybeSingle();

    if(r&&r._ts&&(!linked||r._ts>(S._ts||0)))applyRemote(r);
    else if(!r||!r._ts||(S._ts||0)>r._ts)await push(true);
    localStorage.setItem(LINK,AUTH.user.id);syncReady=true;setSync("Synced");
  }catch(e){syncReady=true;setSync("Offline, will retry");}
}

// ---------- Sheet, toast, palette ----------
function openSheet(html){$("#sheet").innerHTML=html;$("#backdrop").classList.add("open");}
function closeSheet(){$("#backdrop").classList.remove("open");}
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2200);}
// ---------- State edits ----------
function setPath(path,val){const ks=path.split(".");let o=S;ks.slice(0,-1).forEach(k=>o=o[k]);o[ks[ks.length-1]]=val;}
function getPath(path){return path.split(".").reduce((o,k)=>o?.[k],S);}
function rebuildTodayIfFresh(){const k=today(),d=S.days[k];if(d&&!anyDone(d)){d.blocks=buildPlan(k,d.hours,d.mock);}}
function go(v){S.ui.view=v;save();closeSheet();render();window.scrollTo(0,0);}

document.addEventListener("click",e=>{
  if(e.target===$("#backdrop")){closeSheet();return;}
  const el=e.target.closest("[data-act]");if(!el||el.disabled)return;
  const a=el.dataset.act,ds=el.dataset,k=today();
  switch(a){
    case"nav":go(ds.v);break;
    case"more":openSheet(`<h3>More</h3>${[["projects","Projects"],["settings","Settings"],["account","Account"]].map(([v,l])=>`<button class="nav-btn ${S.ui.view===v?"on":""}" style="padding:14px 12px;font-size:16px" data-act="nav" data-v="${v}">${icon(v,22)}${l}</button>`).join("")}`);break;
    case"hours":{const d=ensureDay(k);if(anyDone(d))return;d.hours=+ds.h;d.blocks=buildPlan(k,d.hours,d.mock);save();render();break;}
    case"mock":{const d=ensureDay(k);if(anyDone(d))return;d.mock=ds.m==="1";if(d.mock&&d.hours<4)d.hours=4;d.blocks=buildPlan(k,d.hours,d.mock);save();render();break;}
    case"tick":{const d=ensureDay(k),b=d.blocks.find(x=>x.id===ds.id);if(!b)return;d.done[b.id]=!d.done[b.id];
      if(d.done[b.id]){
        if(b.tid){const tg={Learn:1,Practice:2,Revise:3}[b.type];if(tg&&st(b.tid)<tg){S.status[b.tid]=tg;S.touched[b.tid]=k;toast(`${topicName(b.tid)} → ${STATUS[tg]}`);}else S.touched[b.tid]=k;}
        if(b.pid){const p=S.projects.find(x=>x.id===b.pid),s=p&&p.steps.find(x=>!x.d);if(s){s.d=true;toast(`Step done: ${s.t}`);}}
      }
      save();render();break;}
    case"cal-sel":S.ui.calSel=ds.k;if(ds.k.slice(0,7)!==S.ui.calMonth)S.ui.calMonth=ds.k.slice(0,7);save();render();break;
    case"cal-mv":{const[y,m]=S.ui.calMonth.split("-").map(Number),d=new Date(y,m-1+(+ds.d),1);S.ui.calMonth=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;save();render();break;}
    case"cal-today":S.ui.calMonth=k.slice(0,7);S.ui.calSel=k;save();render();break;
    case"cal-mode":S.ui.calMode=ds.m;save();render();break;
    case"ev-del":S.events=S.events.filter(x=>x.id!==ds.id);save();render();break;
    case"tex":S.ui.tex=ds.e;S.ui.tf="all";S.ui.tq="";save();render();break;
    case"tf":S.ui.tf=ds.f;save();render();break;
    case"sec":{const s=el.closest(".sec");const now=!s.classList.contains("open");s.classList.toggle("open",now);S.ui.open[ds.id]=now;save();break;}
    case"topic":{const v=(st(ds.id)+1)%4;S.status[ds.id]=v;S.touched[ds.id]=k;save();el.className=`st s${v}`;el.textContent=STATUS[v];break;}
    case"mf":S.ui.mf=ds.f;save();render();break;
    case"sx":S.ui.sx=ds.e;save();render();break;
    case"score-new":sheetScore(ds.e);break;
    case"score-del":S.scores=S.scores.filter(s=>s.id!==ds.id);save();render();toast("Score deleted");break;
    case"proj-new":sheetProject();break;
    case"proj-step":{const p=S.projects.find(x=>x.id===ds.id);p.steps[+ds.i].d=!p.steps[+ds.i].d;save();render();break;}
    case"proj-done":{const p=S.projects.find(x=>x.id===ds.id);p.done=!p.done;save();render();toast(p.done?"Marked submitted":"Reopened");break;}
    case"proj-del":S.projects=S.projects.filter(x=>x.id!==ds.id);save();render();toast("Project deleted");break;
    case"pf":S.ui.pf=ds.f;save();render();break;
    case"set":setPath(ds.path,"str" in ds?ds.v:+ds.v);rebuildTodayIfFresh();save();render();break;
    case"mock-del":S.settings.mocks=S.settings.mocks.filter(m=>m.id!==ds.id);save();render();break;
    case"notif-perm":Notification.requestPermission().then(()=>render());break;
    case"clear-samples":{const w=ds.what;if(w==="scores"||w==="all")S.scores=S.scores.filter(s=>!s.sample);if(w==="projects"||w==="all")S.projects=S.projects.filter(p=>!p.sample);if(w==="all")S.settings.mocks=S.settings.mocks.filter(m=>!m.sample);rebuildTodayIfFresh();save();render();toast("Sample data cleared");break;}
    case"reset":openSheet(`<h3>Reset everything?</h3><p class="muted" style="margin-bottom:16px">This clears all plans, topic statuses, scores and projects on this device.</p><div class="row" style="justify-content:flex-end"><button class="btn" data-act="sheet-close">Cancel</button><button class="btn pri" style="background:#C2413B;border-color:#C2413B" data-act="reset-yes">Reset</button></div>`);break;
    case"reset-yes":{S=defaults();save();closeSheet();render();toast("Reset done");break;}
    case"export":{const b=new Blob([JSON.stringify(S,null,2)],{type:"application/json"}),u=URL.createObjectURL(b),l=document.createElement("a");l.href=u;l.download=`anderdingus-${k}.json`;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);break;}
    case"sheet-close":closeSheet();break;
    case"signout":sb.auth.signOut().then(()=>{AUTH.user=null;syncReady=false;render();});break;
    case"auth-reset":{const f=el.closest("form");doAuth("reset",f.elements.email.value.trim(),"");break;}
  }
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.actInput==="tq"){S.ui.tq=t.value;save();const pos=t.selectionStart;render();const n=document.querySelector('[data-act-input="tq"]');n.focus();n.setSelectionRange(pos,pos);return;}

document.addEventListener("submit",e=>{
  const f=e.target.closest("form[data-form]");if(!f)return;e.preventDefault();

    case"score":{const s={id:uid(),exam:fd.exam,provider:fd.provider.trim(),name:(fd.name||"").trim(),date:fd.date};
      if(fd.exam==="pre"){s.subj=fd.subj;s.total=+fd.total;s.max=+fd.max;}else{s.sec={};SCORE_T[fd.exam].forEach(([id])=>s.sec[id]=+fd["sec_"+id]);if(fd.pctile)s.pctile=+fd.pctile;}
      S.scores.push(s);closeSheet();save();render();toast("Score saved");break;}
  }
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeSheet();}});

render();
